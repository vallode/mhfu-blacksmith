<!-- The start of every page's head: build.mjs puts it in place of the HEAD mark. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#6e905f" />
<!--
  Everything runs here: the page loads nothing from elsewhere and talks to
  nothing at all. The disc never leaves the browser.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
/>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Whetstone" />
<link rel="icon" href="images/whetstone-favicon.png" />
<link rel="apple-touch-icon" href="images/whetstone-apple-touch-icon.png" />
<style>
  /*STYLE*/
</style>
