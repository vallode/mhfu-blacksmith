# Build randomfu's web app (apps/randomfu) for randomfu.vallode.com.
#
# A second Netlify site on this repository, next to the MHFU Blacksmith one
# (whose config is the netlify.toml at the root). In its build settings the
# base directory is apps/randomfu, which is how Netlify finds this file;
# `publish` is relative to it, and `command` runs in it. pnpm finds the
# workspace from there, so the whole workspace is installed.
#
# Netlify reads only one netlify.toml: this one if the deployed commit has it,
# else the root's. Its paths are written for the site at the root, so they
# can't work here.
[build]
  command = "pnpm build"
  publish = "dist"
  # Builds are on demand only, as for the site at the root: skip every build
  # Netlify starts on its own for a push or a pull request (exit code 0
  # skips). A build hook's build is never skipped, whatever this returns, so
  # the "Deploy to Netlify" workflow (.github/workflows/netlify-deploy.yml),
  # which calls the hook, is how the app gets built.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# Response headers are in _headers (build.mjs copies it into dist/), which
# Netlify reads as Cloudflare does.
