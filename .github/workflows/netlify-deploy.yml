# Build and deploy the Netlify sites on demand. Netlify skips the builds it
# would start on its own for pushes and pull requests (`ignore` in each
# netlify.toml), so this is the way to deploy: Actions > Deploy to Netlify >
# Run workflow, picking the branch in "Use workflow from".
#
# It POSTs to each site's build hook (Netlify: Site configuration > Build &
# deploy > Continuous deployment > Build hooks), whose URL is kept in a
# repository secret since anyone with it can start a build. The branch is
# passed as `trigger_branch`: main deploys to production, any other branch is
# a branch deploy.
name: Deploy to Netlify

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to deploy
        type: choice
        options:
          - both
          - blacksmith
          - randomfu
        default: both

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the builds
        env:
          SITE: ${{ inputs.site }}
          BRANCH: ${{ github.ref_name }}
          TITLE: Deployed from GitHub Actions by ${{ github.actor }}
          BLACKSMITH_HOOK: ${{ secrets.NETLIFY_BLACKSMITH_BUILD_HOOK }}
          RANDOMFU_HOOK: ${{ secrets.NETLIFY_RANDOMFU_BUILD_HOOK }}
        run: |
          query="trigger_branch=$(jq -rn --arg v "$BRANCH" '$v|@uri')"
          query+="&trigger_title=$(jq -rn --arg v "$TITLE" '$v|@uri')"
          for name in blacksmith randomfu; do
            [ "$SITE" = both ] || [ "$SITE" = "$name" ] || continue
            hook_var="${name^^}_HOOK"
            hook="${!hook_var}"
            if [ -z "$hook" ]; then
              echo "::error::The NETLIFY_${name^^}_BUILD_HOOK secret isn't set."
              exit 1
            fi
            curl --fail-with-body --silent --show-error -X POST -d '{}' "$hook?$query"
            echo "Started the $name build of $BRANCH."
          done
